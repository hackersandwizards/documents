# Owned by @hackersandwizards/scaffolding: check-structure compares this file with the skeleton of
# the pinned version, and `check-structure --fix` writes it with that version's full commit.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@64eb8c233f0706b2d1cf8d1778945845393a7e1e # v5.30.1
    permissions:
      contents: read
      pages: write
      id-token: write
