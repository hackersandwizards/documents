# Publishes the catalog at https://hackersandwizards.github.io/documents/ (Benedikt 01.11., os row
# catalogue-addresses: a public repo may have a public page): scaffolding's reusable workflow runs
# `bun run build` and publishes dist/.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@v0.3.3
    permissions:
      contents: read
      pages: write
      id-token: write
