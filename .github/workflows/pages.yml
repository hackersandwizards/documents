# Owned by @hackersandwizards/scaffolding: check-structure compares this file with the skeleton of
# the pinned version, and `check-structure --fix` writes it with that version's full commit.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@3098b2dfb2a451216f0786326c014f79f2090f54 # v5.19.3
    permissions:
      contents: read
      pages: write
      id-token: write
