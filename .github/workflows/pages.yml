# Owned by @hackersandwizards/scaffolding: check-structure compares this file with the skeleton of
# the pinned version, and `check-structure --fix` writes it with that version's full commit.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@00c59e01c37062e1919f9ed5adcbbe42ce136c3a # v5.37.3
    permissions:
      contents: read
      pages: write
      id-token: write
