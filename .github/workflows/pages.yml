# Publishes the document specimen at https://hackersandwizards.github.io/documents/ (Benedikt
# 01.11., os row catalogue-addresses: a public repo may have a public page).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run specimen
      # The pages load the brand's tokens, fonts, header CSS and SVG logos from node_modules, so
      # those go beside specimen/ as in the checkout, and nothing else of the brand package, whose
      # Git install holds LFS pointers. The root forwards to the specimen as the local server does.
      - run: |
          brand=node_modules/@hackersandwizards/brand
          mkdir -p "_site/$brand/logos"
          cp -R specimen _site/
          cp -RL "$brand/tokens" "$brand/generated" "$brand/expert" "_site/$brand/"
          cp "$brand"/logos/*.svg "$brand/logos/favicon.ico" "_site/$brand/logos/"
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=specimen/">' > _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
