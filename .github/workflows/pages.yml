# Owned by @hackersandwizards/scaffolding: check-structure compares this file with the skeleton of
# the pinned version, and `check-structure --fix` writes it with that version's full commit.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@22c053433d356db3f4e24bceb1f5f2b198c18929 # v5.39.1
    permissions:
      contents: read
      pages: write
      id-token: write
